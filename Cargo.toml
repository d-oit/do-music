[package]
name = "do-music"
version = "0.1.0"
edition = "2024"
description = "CLI-first AI music generator using GMI Cloud MiniMax Music 3.0"
license = "MIT"
repository = "https://github.com/d-oit/do-music"
readme = "README.md"

[[bin]]
name = "do-music"
path = "src/main.rs"

[lib]
name = "do_music"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
base64 = "0.23.1"
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "process", "time"] }

[dev-dependencies]
tempfile = "3"
